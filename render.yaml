services:
  - type: web
    name: bbb-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: Krish1959/bbb-web
      - key: GITHUB_BRANCH
        value: main
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TITLE
        value: "LiveAvatar – Client Onboarding"
